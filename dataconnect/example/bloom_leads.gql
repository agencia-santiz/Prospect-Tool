mutation BootstrapWorkspace(
  $email: String!
  $name: String!
  $workspaceName: String!
  $workspaceSlug: String!
) @auth(level: USER) @transaction {
  user_insert(
    data: {
      id_expr: "uuidV4()"
      authUid_expr: "auth.uid"
      email: $email
      name: $name
      authProvider: "firebase"
      lastLoginAt_expr: "request.time"
    }
  )
  workspace_insert(
    data: {
      ownerId_expr: "response.user_insert.id"
      name: $workspaceName
      slug: $workspaceSlug
      plan: "free"
      isArchived: false
    }
  )
  workspaceMember_insert(
    data: {
      workspaceId_expr: "response.workspace_insert.id"
      userId_expr: "response.user_insert.id"
      role: "owner"
      status: "active"
    }
  )
}

mutation CreateSavedList(
  $id: UUID!
  $workspaceId: UUID!
