query GetCurrentUserByAuthUid($authUid: String!) @auth(level: USER) {
  users(where: { authUid: { eq: $authUid } }, limit: 1) {
    id
    authUid
    email
    name
    avatarUrl
    authProvider
    plan
    isActive
    usageLimit
    usageCount
    createdAt
    updatedAt
    lastLoginAt
  }
}

query GetWorkspaceBySlug($slug: String!) @auth(level: USER) {
  workspaces(where: { slug: { eq: $slug } }, limit: 1) {
    id
    name
    slug
    plan
    isArchived
    createdAt
    updatedAt
    owner {
      id
      name
      email
      avatarUrl
    }
  }
}

