}

query ListStaleDeals($workspaceId: UUID!, $staleDate: Timestamp!) @auth(level: USER) {
  deals(where: { workspaceId: { eq: $workspaceId }, updatedAt: { lt: $staleDate } }, limit: 5) {
    id
    company { id }
    pipeline { id }
    stage { id }
    title
    value
    priority
    payload
  }
}

query ListStaleLeads($workspaceId: UUID!, $staleDate: Timestamp!) @auth(level: USER) {
